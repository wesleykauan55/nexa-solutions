<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Solutions — Chamados</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Sistema de Chamados</h1>
  <p>Interface inicial da Nexa Solutions.</p>

  <section>
    <h2>Abrir chamado</h2>


    <form id="form-chamado">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" type="text">

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao"></textarea>

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="ABERTO">Aberto</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDO">Concluído</option>
      </select>

      <button type="submit">Cadastrar chamado</button>
    </form>

    <p id="mensagem"></p>
  </section>

  <section>
    <h2>Chamados cadastrados</h2>
    <button id="atualizar">Atualizar lista</button>
    <div id="lista-chamados"></div>
  </section>

<script src="script.js"></script>
</body>
</html>
